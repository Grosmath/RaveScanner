<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENCORE — Montréal</title>
<meta name="description" content="Les soirées house, techno et électroniques à Montréal. Ce qui vient, et ce qu'il ne faut pas rater.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./encore.css">
</head>
<body>

<!-- Barre unique et collante. Elle porte la marque, la navigation entre les
     deux sections, la ville et la recherche - qui deviendra l'entree vers les
     fiches artistes. -->
<header class="top">
  <a class="brand" href="#planning">ENCO<em>RE</em></a>

  <nav class="sections" aria-label="Sections">
    <a href="#planning" class="is-active" data-section="planning">Planning</a>
    <a href="#spotlight" data-section="spotlight">À ne pas rater</a>
  </nav>

  <!-- Initiales en dessous de 760 px : « Montréal » débordait de la barre. -->
  <div class="city" role="group" aria-label="Ville">
    <button type="button" data-city="montreal" class="is-active">
      <span class="long">Montréal</span><span class="court">MTL</span>
    </button>
    <button type="button" data-city="paris">
      <span class="long">Paris</span><span class="court">PAR</span>
    </button>
  </div>

  <div class="search">
    <input type="search" id="q" placeholder="Artiste, lieu, soirée…" autocomplete="off" spellcheck="false" aria-label="Rechercher">
  </div>
</header>

<div class="notice" id="error" hidden></div>

<main>

  <!-- Ce qui est entré dans le planning ces derniers jours, au-dessus du
       reste, la plus grosse soirée en tête. Masquée tant qu'il n'y a rien à
       dire.

       « Repéré » et non « annoncé » : on connaît la date à laquelle NOUS avons
       vu la soirée, pas celle à laquelle elle a été annoncée. Les deux
       coïncident presque toujours, sauf le jour où l'on ajoute une source ou
       l'on élargit la fenêtre — le libellé reste vrai dans les deux cas. -->
  <section class="news" id="news" hidden aria-label="Repéré cette semaine">
    <h2>Repéré cette semaine</h2>
    <div class="news-rail" id="news-rail"></div>
  </section>

  <section class="panel" id="planning">
    <div class="panel-head">
      <div>
        <h2>Le planning</h2>
        <p class="sub" id="planning-sub">—</p>
      </div>

      <!-- Deux réglages : le niveau de mise en avant, et les familles de
           genres. La vue liste et le choix du nombre de jours ont été retirés
           le 2026-09-16. Le filtre par genre, lui, avait disparu par oubli au
           passage à cette interface ; il revient par familles, rangées par le
           moteur (engine/reload/genres.py). -->
      <div class="controls">
        <details class="genres" id="genres">
          <summary><span id="genres-label">Genres</span></summary>
          <div class="genres-panel">
            <div class="genres-list" id="genres-list"></div>
            <p class="genres-note" id="genres-note"></p>
            <button type="button" class="genres-clear" id="genres-clear">Tout afficher</button>
          </div>
        </details>
        <div class="seg" role="group" aria-label="Mise en avant">
          <button type="button" data-tier="0" class="is-active">Tout</button>
          <button type="button" data-tier="2">À retenir</button>
          <button type="button" data-tier="3">À ne pas rater</button>
        </div>
      </div>
    </div>

    <div class="panel-body">
      <div class="scroller" id="board-wrap"><div class="board" id="board"></div></div>
      <!-- Hors de la zone défilante, sinon un élément positionné à l'intérieur
           peut en allonger la largeur. Remplace la barre de défilement,
           masquée : elle disait « il y a une suite » en abîmant la page. -->
      <span class="hint-scroll" id="hint-scroll" aria-hidden="true">→</span>
      <p class="empty" id="empty" hidden>Rien ne correspond à ces filtres.</p>
    </div>
  </section>

  <!-- Le rail n'est pas dans un panneau : les cartes et leur titre posent
       directement sur le fond de la page. -->
  <section class="rail-section" id="spotlight">
    <div class="rail-head">
      <h2>À ne pas rater</h2>
      <p class="sub">Le haut du panier des 30 prochains jours</p>
    </div>
    <div class="rail" id="rail"></div>
  </section>

</main>

<!-- Fiche événement. Panneau latéral sur desktop, feuille montante sur mobile.
     C'est aussi l'emplacement prévu pour le bouton « favori » et, plus tard,
     les liens vers les fiches artistes. -->
<div class="veil" id="veil" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="Détail de la soirée" tabindex="-1">
  <button type="button" class="sheet-close" id="sheet-close" aria-label="Fermer">✕</button>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<script src="./cards.js"></script>
<script type="module" src="./encore.js"></script>
</body>
</html>
